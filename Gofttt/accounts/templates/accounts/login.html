{% extends 'base.html' %}
{% load static %}

{% block content %}
    

<main class="main">

    <div class="site-breadcrumb" style="background: url('{% static 'assets/images/goft/photo17166891664.jpg' %}')">
        <div class="container">
            <h2 class="breadcrumb-title">ورود</h2>
            <ul class="breadcrumb-menu">
                <li><a href="{% url 'home:index' %}">خانه</a></li>
                <li class="active">ورود</li>
            </ul>
        </div>
    </div>

    <div class="auth-area py-80">
        <div class="container">
            <div class="col-md-5 col-lg-4 mx-auto">
                <div class="auth-wrap">
                    <div class="auth-header">
                        <img src="{% static 'assets/images/goft2.png' %}" alt="">
                        <p>با حساب گفت کست خود وارد شوید</p>
                    </div>
                    <div class="auth-form">
                        <form method="post">
                            {% csrf_token %}
                            <div class="form-group">
                                <label>شماره موبایل</label>
                                <input type="text" name="phone_number" id="phone_number" class="form-control" placeholder="شماره موبایل">
                            </div>
                            <div class="form-group">
                                <label>رمز عبور</label>
                                <input type="password" name="password" id="password" class="form-control" placeholder="رمز عبور">
                            </div>
                            <div class="auth-check">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="" id="remember">
                                    <label class="form-check-label" for="remember">
                                        مرا بخاطر بسپار
                                    </label>
                                </div>
                                <a href="{% url 'accounts:forgot_password' %}">رمز عبور را فراموش کرده اید؟</a>
                            </div>
                            <div class="auth-btn">
                                <button type="submit" class="theme-btn"><span class="far fa-sign-in"></span> ورود</button>
                            </div>
                        </form>
                        <div class="auth-footer">
                            <div class="auth-social">
                                <span class="auth-divider">یا</span>
                                <div class="auth-social-list">
                                    <a href="#" class="auth-fb"><i class="fab fa-facebook-f"></i>فیسبوک</a>
                                    <a href="#" class="auth-gl"><i class="fab fa-google"></i>گوگل</a>
                                    <a href="#" class="auth-tw"><i class="fab fa-x-twitter"></i>توییتر</a>
                                </div>
                            </div>
                            <p>حساب ندارید؟ <a href="{% url 'accounts:user_register' %}">ثبت نام کنید.</a></p>                            </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</main>


{% endblock %}
